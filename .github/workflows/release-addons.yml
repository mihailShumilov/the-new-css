name: Release Addons

on:
  push:
    branches: [main]
    paths:
      - 'addons/**'
  workflow_dispatch:

jobs:
  detect-changes:
    # Skip commits pushed by this workflow (version bumps)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.changed.outputs.addons }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed addons
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: release all addons
            CHANGED_ADDONS=$(ls -d addons/*/ | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Push trigger: only release addons with changes
            CHANGED_ADDONS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- addons/ \
              | cut -d/ -f2 \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "addons=$CHANGED_ADDONS" >> "$GITHUB_OUTPUT"
          echo "Changed addons: $CHANGED_ADDONS"

  release-addon:
    needs: detect-changes
    if: needs.detect-changes.outputs.addons != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        addon: ${{ fromJson(needs.detect-changes.outputs.addons) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm and configure registry
        run: |
          npm install -g npm@latest
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Install dependencies
        run: npm install

      - name: Bump addon patch version
        id: version
        working-directory: addons/${{ matrix.addon }}
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Bumped $NAME to $VERSION"

      - name: Update lock file
        run: npm install --package-lock-only

      - name: Build addons
        run: npm run build:addons

      - name: Test
        run: npm test

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addons/${{ matrix.addon }}/package.json package-lock.json
          git commit -m "chore: release ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          TAG="${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin main
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "${{ steps.version.outputs.name }} ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Publish addon to npm
        working-directory: addons/${{ matrix.addon }}
        run: npm publish --provenance --access public
